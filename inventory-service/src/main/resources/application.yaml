spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5432/inventorydb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: inventory-service

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: true
        spring.json.type.mapping: >
          com.ecommerce.order.event.OrderCreatedEvent:com.ecommerce.inventory.kafka.OrderEvent,
          com.ecommerce.order.kafka.ReleaseInventoryEvent:com.ecommerce.inventory.kafka.ReleaseInventoryEvent

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.type.mapping: >
          reserved:com.ecommerce.inventory.kafka.InventoryReservedEvent,
          rejected:com.ecommerce.inventory.kafka.InventoryRejectedEvent

server:
  port: 8083

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/